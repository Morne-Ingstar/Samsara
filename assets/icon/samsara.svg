<!--
Samsara mark: SINGLE SOURCE for every icon size and state.
samsara/ui/tray_qt.py render_mark() draws it for the tray, the listening
indicator, the splash and tools/gen_icons.py (which writes the PNG/ICO set);
do not hand-edit the generated files.

Owner decisions 2026-09-13: one accent (cyan), one semantic (red = recording).
The wheel is the mark; there is no disc behind the eye. The mark is
MONOCHROME per state: render_mark() gives the ring and the eye the same
theme token, so the literals below are only the idle defaults.

Structure
  The three-segment wheel carries CAPTURE state:
    #ring-hollow  segments outlined  -> idle (ICON_IDLE), listening/armed (ACCENT), Ava (AVA)
    #ring-filled  segments filled    -> recording (RECORDING)
    Fill vs outline carries recording without relying on colour. Spin
    (thinking/transcribing) and pulse (listening) are applied at runtime.
  The eye, in the open space inside the wheel, carries HANDS-FREE state:
    (no eye)      -> hands-free off
    #eye-closed   one lid line          -> asleep
    #eye-open     two lids + pupil dot  -> wake listener armed
    heard         is an ANIMATION (tray_qt.HEARD_KEYFRAMES): #eye-open in
                  RECORDING red with the ring brightened, then the lid closes.

Two drawings, the second with "-small" ids:
  #regular (24 px and up) and #small (the simplified 16 px variant: thin
  centre-line arcs with wider gaps, and the eye reduced to a line vs a
  dot-in-ellipse). 1 px strokes are the floor at 16 px: in this 64-unit
  viewBox, 4 units = 1 px at 16 px.

data-role attributes tell render_mark() what to recolour:
  eye -> stroke, pupil -> fill. Ring groups take the colour on whichever of
  fill/stroke they paint.
-->
