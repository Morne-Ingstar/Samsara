<?xml version="1.0" encoding="UTF-8"?>
<!--
Samsara mark: SINGLE SOURCE for every icon size and state.
samsara/ui/tray_qt.py render_mark() draws it for the tray, the listening
indicator, the splash and tools/gen_icons.py (which writes the PNG/ICO set);
do not hand-edit the generated files.

Owner decisions 2026-09-13: one accent (cyan), one semantic (red = recording).
The wheel is the mark; there is no disc behind the eye. The mark is
MONOCHROME per state: render_mark() gives the ring and the eye the same
theme token, so the literals below are only the idle defaults.

Structure
  The three-segment wheel carries CAPTURE state:
    #ring-hollow  segments outlined  -> idle (ICON_IDLE), listening/armed (ACCENT), Ava (AVA)
    #ring-filled  segments filled    -> recording (RECORDING)
    Fill vs outline carries recording without relying on colour. Spin
    (thinking/transcribing) and pulse (listening) are applied at runtime.
  The eye, in the open space inside the wheel, carries HANDS-FREE state:
    (no eye)      -> hands-free off
    #eye-closed   one lid line          -> asleep
    #eye-open     two lids + pupil dot  -> wake listener armed
    heard         is an ANIMATION (tray_qt.HEARD_KEYFRAMES): #eye-open in
                  RECORDING red with the ring brightened, then the lid closes.

Two drawings, the second with "-small" ids:
  #regular (24 px and up) and #small (the simplified 16 px variant: thin
  centre-line arcs with wider gaps, and the eye reduced to a line vs a
  dot-in-ellipse). 1 px strokes are the floor at 16 px: in this 64-unit
  viewBox, 4 units = 1 px at 16 px.

data-role attributes tell render_mark() what to recolour:
  eye -> stroke, pupil -> fill. Ring groups take the colour on whichever of
  fill/stroke they paint.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g id="regular">
    <g id="ring-hollow" fill="none" stroke="#8b929c" stroke-width="3" stroke-linejoin="round">
      <path data-role="segment" d="M 35.14,2.16 A 30 30 0 0 1 59.41,44.20 L 49.36,39.73 A 19 19 0 0 0 33.99,13.10 Z"/>
      <path data-role="segment" d="M 56.27,49.63 A 30 30 0 0 1 7.73,49.63 L 16.63,43.17 A 19 19 0 0 0 47.37,43.17 Z"/>
      <path data-role="segment" d="M 4.59,44.20 A 30 30 0 0 1 28.86,2.16 L 30.01,13.10 A 19 19 0 0 0 14.64,39.73 Z"/>
    </g>
    <g id="ring-filled" fill="#8b929c" stroke="none" display="none">
      <path data-role="segment" d="M 35.14,2.16 A 30 30 0 0 1 59.41,44.20 L 49.36,39.73 A 19 19 0 0 0 33.99,13.10 Z"/>
      <path data-role="segment" d="M 56.27,49.63 A 30 30 0 0 1 7.73,49.63 L 16.63,43.17 A 19 19 0 0 0 47.37,43.17 Z"/>
      <path data-role="segment" d="M 4.59,44.20 A 30 30 0 0 1 28.86,2.16 L 30.01,13.10 A 19 19 0 0 0 14.64,39.73 Z"/>
    </g>
    <g id="eye-closed" fill="none" stroke-linecap="round">
      <line data-role="eye" x1="21" y1="32" x2="43" y2="32" stroke="#8b929c" stroke-width="3.5"/>
    </g>
    <g id="eye-open" fill="none" stroke-linecap="round" display="none">
      <path data-role="eye" d="M 20,32 Q 32,21 44,32" stroke="#8b929c" stroke-width="3"/>
      <path data-role="eye" d="M 20,32 Q 32,43 44,32" stroke="#8b929c" stroke-width="3"/>
      <circle data-role="pupil" cx="32" cy="32" r="2.5" fill="#8b929c" stroke="none"/>
    </g>
  </g>

  <g id="small" display="none">
    <g id="ring-hollow-small" fill="none" stroke="#8b929c" stroke-width="5" stroke-linecap="butt">
      <path data-role="segment" d="M 38.07,5.69 A 27 27 0 0 1 57.82,39.89"/>
      <path data-role="segment" d="M 51.75,50.41 A 27 27 0 0 1 12.25,50.41"/>
      <path data-role="segment" d="M 6.18,39.89 A 27 27 0 0 1 25.93,5.69"/>
    </g>
    <g id="ring-filled-small" fill="none" stroke="#8b929c" stroke-width="9" stroke-linecap="butt" display="none">
      <path data-role="segment" d="M 38.07,5.69 A 27 27 0 0 1 57.82,39.89"/>
      <path data-role="segment" d="M 51.75,50.41 A 27 27 0 0 1 12.25,50.41"/>
      <path data-role="segment" d="M 6.18,39.89 A 27 27 0 0 1 25.93,5.69"/>
    </g>
    <g id="eye-closed-small" fill="none" stroke-linecap="butt">
      <line data-role="eye" x1="18" y1="32" x2="46" y2="32" stroke="#8b929c" stroke-width="4.5"/>
    </g>
    <g id="eye-open-small" display="none">
      <ellipse data-role="eye" cx="32" cy="32" rx="13" ry="8.5" fill="none" stroke="#8b929c" stroke-width="4"/>
      <circle data-role="pupil" cx="32" cy="32" r="3.5" fill="#8b929c" stroke="none"/>
    </g>
  </g>
</svg>
