<?xml version="1.0" encoding="UTF-8"?>
<!--
Samsara mark: SINGLE SOURCE for every icon size and state.
samsara/ui/tray_qt.py render_mark() draws it for the tray, the listening
indicator, the splash and tools/gen_icons.py (which writes the PNG/ICO set);
do not hand-edit the generated files.

The shared mark is an articulated three-part Ouroboros. Two joints remain
open on the ring; the third is a head meeting a tapered tail at the top.
The head has an eye and mouth cut from its fill, so neither becomes a
floating centre mark. Only the static brand presentation blends cyan toward
warm red near the head; the live recording ring remains solid semantic red.

The #regular centrelines and filled stroke contours are GENERATED from
samsara/ui/tray_qt.py by tools/gen_icons.py; do not hand-edit them.
The #small paths are a heavier, simplified three-part drawing with wider
joints, so articulation survives 16 to 32 pixels without hairline details.
The centre is empty at rest; an open eye or pupil denotes armed/heard state.
Ring groups take their theme colour from render_mark(), which also applies
rotation and animation. No background disc is painted. XML comments must
not contain a doubled hyphen.
-->
