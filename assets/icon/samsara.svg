<?xml version="1.0" encoding="UTF-8"?>
<!--
Samsara mark: SINGLE SOURCE for every icon size and state.
samsara/ui/tray_qt.py render_mark() draws it for the tray, the listening
indicator, the splash and tools/gen_icons.py (which writes the PNG/ICO set);
do not hand-edit the generated files.

Owner decisions 2026-09-13: one accent (cyan), one semantic (red = recording).
The wheel is the mark; there is no disc behind the eye. The mark is
MONOCHROME per state: render_mark() gives the ring and the eye the same
theme token, so the literals below are only the idle defaults.

Structure
  The three-segment wheel (an ouroboros from 24 px up) carries CAPTURE state.
  Each segment is ONE centreline on the ring circle (#ring-centreline, hidden
  reference arcs) stroked at a width that varies along it: the tail tapers
  from a point, the head swells into a round-capped nose. Two weights of that
  same stroke:
    #ring-hollow  thin weight (3)    -> idle (ICON_IDLE), listening/armed (ACCENT), Ava (AVA)
    #ring-filled  band weight (11)   -> recording (RECORDING)
    Weight carries recording without relying on colour. Spin
    (thinking/transcribing) and pulse (listening) are applied at runtime.
  The #regular ring paths are GENERATED by tools/gen_icons.py from
  samsara/ui/tray_qt.py (ring_centreline / stroke_scale): SVG strokes cannot
  vary in width, so each is the variable-width stroke expanded into one
  filled contour. Do not hand-edit them; gen_icons check mode flags drift.
  (No double hyphens anywhere in this comment: XML forbids them.)
  The eye, in the open space inside the wheel, carries HANDS-FREE state:
    (no eye)      -> hands-free off
    #eye-closed   one lid line          -> asleep
    #eye-open     two lids + pupil dot  -> wake listener armed
    heard         is an ANIMATION (tray_qt.HEARD_KEYFRAMES): #eye-open in
                  RECORDING red with the ring brightened, then the lid closes.

Two drawings, the second with "-small" ids:
  #regular (24 px and up) and #small (16 to 20 px, drawn for PRESENCE on a
  taskbar, not fidelity: a heavy plain ring, stroke 8 hollow / 12 recording
  (2 / 3 px at 16 px), radius 25, 40-degree gaps so the three segments stay
  separate and a turning ring reads as turning; no head or tail; the eye is
  ONE solid element: a pupil dot (r 7) when open, a lid bar (stroke 8) when
  asleep, nothing when off). No hairlines: in this 64-unit viewBox 4 units
  = 1 px at 16 px, and nothing in #small is thinner than 8.

data-role attributes tell render_mark() what to recolour:
  eye -> stroke, pupil -> fill. Ring groups take the colour on whichever of
  fill/stroke they paint.
-->
