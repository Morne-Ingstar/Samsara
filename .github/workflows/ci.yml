name: CI

permissions:
  contents: read

env:
  # Keep CI aligned with the local development environment and release build.
  PYTHON_VERSION: '3.11'

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # Samsara is Windows-only and imports Win32, WinRT, WASAPI, and UI
    # Automation dependencies during collection. Linux cannot exercise the
    # supported runtime and fails before the meaningful suites can run.
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Verify embedded version identity
        if: matrix.shard == 0
        shell: pwsh
        run: python tools\check_release_version.py

      - name: Set up Node.js for browser-extension tests
        if: matrix.shard == 0
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Show Numbers browser extension
        if: matrix.shard == 0
        shell: pwsh
        run: node --test browser_extension/content-core.test.js browser_extension/bridge-auth-core.test.js

      - name: Check Qt discipline
        if: matrix.shard == 0
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_qt_discipline.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      # Queue 110: the checker existed but nothing ran it, so three
      # unregistered threads and two stale allowlist line numbers sat in the
      # tree undetected. It needs no dependencies -- stdlib only -- so it runs
      # before the suite and fails fast.
      - name: Check thread discipline
        if: matrix.shard == 0
        shell: pwsh
        run: python tools\check_thread_discipline.py

      - name: Report plugin imports
        if: matrix.shard == 0
        shell: pwsh
        run: python tools/ci_plugin_import_report.py

      - name: Run tests with coverage
        timeout-minutes: 100
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SAMSARA_TEST_SHARD_INDEX: ${{ matrix.shard }}
          SAMSARA_TEST_SHARD_TOTAL: '4'
        # A thread timeout/native crash retires one worker; the controller
        # reports that test as failed and continues with replacement workers.
        # Keep each file together so its module/session state stays local.
        # The supervisor starts first and runs pytest as its background child.
        # It also covers collection, the controller, gaps and interpreter exit.
        run: python -u tools/ci_hang_reporter.py --state-dir ci-hang-report --junit-path junit.xml -- pytest -m "not requires_desktop" -n 2 --dist loadfile --max-worker-restart=100 --timeout=120 --timeout-method=thread --cov=. --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -v

      - name: Run native desktop tests
        if: always() && matrix.shard == 0
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        run: |
          Remove-Item Env:\QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          python -m pytest -m requires_desktop -p no:cacheprovider --timeout=120 --timeout-method=thread -v

      # File balancing can move the icon tests between shards. Capture on
      # every shard, including failed test jobs, so the relevant runner is kept.
      - name: Capture generated icon pixel differences
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SAMSARA_HOME_DIR: ${{ runner.temp }}/icon-diagnostics-home
        run: python tools/gen_icons.py --diagnostics "${{ runner.temp }}/icon-pixels"

      - name: Upload generated icon pixel differences
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-pixels-${{ matrix.shard }}
          path: ${{ runner.temp }}/icon-pixels
          if-no-files-found: warn

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.shard }}
          path: |
            junit.xml
            coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          name: test-coverage-${{ matrix.shard }}
          flags: shard-${{ matrix.shard }}
          fail_ci_if_error: false
        continue-on-error: true
