name: CI

permissions:
  contents: read

env:
  # Keep CI aligned with the local development environment and release build.
  PYTHON_VERSION: '3.11'

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # Samsara is Windows-only and imports Win32, WinRT, WASAPI, and UI
    # Automation dependencies during collection. Linux cannot exercise the
    # supported runtime and fails before the meaningful suites can run.
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Verify embedded version identity
        shell: pwsh
        run: python tools\check_release_version.py

      - name: Set up Node.js for browser-extension tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Show Numbers browser extension
        shell: pwsh
        run: node --test browser_extension/content-core.test.js browser_extension/bridge-auth-core.test.js

      - name: Check Qt discipline
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_qt_discipline.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      # Queue 110: the checker existed but nothing ran it, so three
      # unregistered threads and two stale allowlist line numbers sat in the
      # tree undetected. It needs no dependencies -- stdlib only -- so it runs
      # before the suite and fails fast.
      - name: Check thread discipline
        shell: pwsh
        run: python tools\check_thread_discipline.py

      - name: Run tests with coverage
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        # A thread timeout/native crash retires one worker; the controller
        # reports that test as failed and continues with replacement workers.
        # Keep each file together so its module/session state stays local.
        run: python -m pytest -m "not requires_desktop" -n 2 --dist loadfile --max-worker-restart=100 --timeout=120 --timeout-method=thread --cov=. --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -v

      - name: Run native desktop tests
        if: always()
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        run: |
          Remove-Item Env:\QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          python -m pytest -m requires_desktop -p no:cacheprovider --timeout=120 --timeout-method=thread -v

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
