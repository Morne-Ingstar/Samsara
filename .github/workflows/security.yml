name: Secret guard

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select incoming commits
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_COMMITS: ${{ toJSON(github.event.commits.*.id) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          def select_log_opts(event, before, head, pr_base, pr_head, pushed, has_commit):
              def checked(sha):
                  if not re.fullmatch(r"[0-9a-f]{40}", sha or "") or not has_commit(sha):
                      raise ValueError("Incoming commit is unavailable or invalid")
                  return sha

              if event == "pull_request":
                  return f"{checked(pr_base)}..{checked(pr_head)}"
              if event != "push":
                  raise ValueError("Unsupported secret-guard event")
              checked(head)
              if re.fullmatch(r"[0-9a-f]{40}", before or "") and has_commit(before):
                  return f"{before}..{head}"
              # A new branch or rewritten history may have no usable previous
              # tip. Scan every commit listed in the push, plus the tip, rather
              # than walking unrelated old history or silently scanning nothing.
              if not isinstance(pushed, list) or len(pushed) >= 2048:
                  raise ValueError("Cannot safely bound an incomplete push commit list")
              commits = dict.fromkeys([*(checked(sha) for sha in pushed), head])
              return "--no-walk " + " ".join(commits)

          def has_commit(sha):
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{sha}^{{commit}}"],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0

          log_opts = select_log_opts(
              os.environ["EVENT_NAME"], os.environ.get("BEFORE", ""),
              os.environ["PUSH_HEAD"], os.environ.get("PR_BASE", ""),
              os.environ.get("PR_HEAD", ""),
              json.loads(os.environ.get("PUSH_COMMITS", "null")) or [], has_commit,
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"log_opts={log_opts}\n")
          PY
      # Official CLI container action: explicit log-opts for every event.
      # Version tag per offline brief; resolve a reviewed SHA in a networked task.
      - name: Scan for secrets and private exports
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.2
        env:
          # Allow Git to inspect the runner-owned mount from the CLI container.
          # Trust only its mounted workspace, without writing Git config.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: >-
            safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: >-
            git --config=.gitleaks.toml --redact
            "--log-opts=${{ steps.range.outputs.log_opts }}"
