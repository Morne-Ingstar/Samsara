name: Release (CPU build)

# Manually uploads verified CPU build artifacts to a draft release. Tag pushes
# never trigger this workflow. See RELEASING.md
# for the full picture and Docs/RELEASE_CI.md ("Where the wake-word models
# come from") for the 2026-09-13 change behind this file's shape.
#
# History: this workflow used to run its own PyInstaller build on the same
# tag push, in parallel with release-build.yml, and attach whatever it
# produced. When v0.23.0-beta.1's CI build shipped 0 of 9 OpenWakeWord
# models, release-build.yml failed its own OWW check while this workflow was
# about to attach the very same broken ZIP and had to be cancelled by hand.
# Nothing tied the two together.
#
# Supply a successful release-build run ID and release tag, then explicitly
# set upload_to_release=true. The workflow rechecks artifacts and refuses to
# attach them if the release already contains a SamsaraSetup installer.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (for example v0.42.2)'
        required: true
        type: string
      build_run_id:
        description: 'Successful release-build workflow run ID'
        required: true
        type: string
      upload_to_release:
        description: 'Attach verified build artifacts to this draft release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write # attach the zip to the GitHub Release for the tag
  actions: read   # download the release-build run's artifact

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish-cpu:
    runs-on: windows-latest
    timeout-minutes: 30
    # No tag-push path: manual dispatch and a true opt-in are required.
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_release

    steps:
      - name: Validate selected release-build run
        id: run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run view "${{ inputs.build_run_id }}" --json conclusion,event,headBranch,headSha,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read release-build run ${{ inputs.build_run_id }}" }
          if ($run.workflowName -ne 'Release Build (CPU)' -or $run.conclusion -ne 'success' -or $run.event -ne 'push' -or $run.headBranch -ne "${{ inputs.version }}") {
            throw "Selected run must be a successful tag-push run of Release Build for ${{ inputs.version }}"
          }
          echo "head_sha=$($run.headSha)" >> $env:GITHUB_OUTPUT

      - name: Checkout the built commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.run.outputs.head_sha }}

      - name: Set up Node.js for browser-extension tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Show Numbers browser extension
        shell: pwsh
        run: node --test browser_extension/content-core.test.js browser_extension/bridge-auth-core.test.js

      - name: Check Qt discipline
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_qt_discipline.py

      - name: Resolve version string
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          Write-Host "Uploading artifacts from release-build run ${{ inputs.build_run_id }} for $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download the verified build artifact from release-build
        uses: actions/download-artifact@v6
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: Samsara-Windows-${{ steps.version.outputs.version }}.zip
          path: release_asset
          merge-multiple: true

      # 33: the wake-word models component and the release manifest come
      # from the same release-build run (docs/RELEASE_MANIFEST.md); they are
      # never regenerated here.
      - name: Download the wake-word models component
        uses: actions/download-artifact@v6
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: Samsara-WakeWord-Models-${{ steps.version.outputs.version }}.zip
          path: release_asset

      - name: Download the release manifest
        uses: actions/download-artifact@v6
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: manifest-${{ steps.version.outputs.version }}
          path: release_asset

      - name: Gate -- re-verify the artifact before attaching
        id: gate
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "Samsara-Windows-$version.zip"
          $zip = Join-Path "release_asset" $zipName
          $sidecar = "$zip.sha256"
          foreach ($f in @($zip, $sidecar)) {
            if (-not (Test-Path -LiteralPath $f)) { Write-Error "artifact file missing: $f"; exit 1 }
          }
          # .sha256 sidecar must match the zip we are about to publish.
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content -LiteralPath $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) { Write-Error "sha256 sidecar mismatch: $actual != $expected"; exit 1 }
          Write-Host "[PASS] sidecar matches: $actual"

          # The nine bundled OpenWakeWord model files must be inside the zip
          # (the check that caught v0.23.0-beta.1's CI build).
          Expand-Archive -LiteralPath $zip -DestinationPath unpacked -Force
          $owwModels = @(
            'alexa_v0.1.onnx', 'embedding_model.onnx', 'hey_jarvis_v0.1.onnx',
            'hey_mycroft_v0.1.onnx', 'hey_rhasspy_v0.1.onnx', 'melspectrogram.onnx',
            'silero_vad.onnx', 'timer_v0.1.onnx', 'weather_v0.1.onnx'
          )
          $owwDir = 'unpacked\_internal\openwakeword\resources\models'
          $missing = $owwModels | Where-Object { -not (Test-Path (Join-Path $owwDir $_)) }
          if ($missing) { Write-Error "zip is missing bundled OWW model file(s): $($missing -join ', ')"; exit 1 }
          Write-Host "[PASS] all 9 bundled OWW wake-word model files present in $zipName"
          if (-not (Test-Path 'unpacked\Samsara.exe')) { Write-Error "zip has no Samsara.exe"; exit 1 }
          Remove-Item -Recurse -Force unpacked
          echo "zip=$zip" >> $env:GITHUB_OUTPUT
          echo "sidecar=$sidecar" >> $env:GITHUB_OUTPUT

          # 33: the manifest must describe exactly the assets being attached.
          # Its core and wake-word-models entries are re-hashed against the
          # files here, so a manifest from a different build can never be
          # published beside these ZIPs.
          $modelsZip = Join-Path "release_asset" "Samsara-WakeWord-Models-$version.zip"
          $modelsSidecar = "$modelsZip.sha256"
          $manifest = Join-Path "release_asset" "manifest.json"
          foreach ($f in @($modelsZip, $modelsSidecar, $manifest)) {
            if (-not (Test-Path -LiteralPath $f)) { Write-Error "release asset missing: $f"; exit 1 }
          }
          $doc = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($doc.schema_version -ne 1) { Write-Error "manifest schema_version $($doc.schema_version) is not 1"; exit 1 }
          if ($doc.release_tag -ne $version) { Write-Error "manifest release_tag $($doc.release_tag) is not $version"; exit 1 }
          if ($doc.git_sha -ne "${{ steps.run.outputs.head_sha }}") { Write-Error "manifest git_sha $($doc.git_sha) is not the built commit"; exit 1 }
          foreach ($pair in @(@('core', $zip), @('wake-word-models', $modelsZip))) {
            $id, $file = $pair
            $entry = $doc.components | Where-Object { $_.id -eq $id }
            if (-not $entry) { Write-Error "manifest has no component '$id'"; exit 1 }
            $fileHash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $fileSize = (Get-Item -LiteralPath $file).Length
            if ($entry.sha256 -ne $fileHash) { Write-Error "manifest '$id' sha256 $($entry.sha256) != $fileHash"; exit 1 }
            if ($entry.size_bytes -ne $fileSize) { Write-Error "manifest '$id' size_bytes $($entry.size_bytes) != $fileSize"; exit 1 }
            if ($entry.url -ne "https://github.com/${{ github.repository }}/releases/download/$version/$(Split-Path -Leaf $file)") {
              Write-Error "manifest '$id' url $($entry.url) does not point at this release's asset"; exit 1
            }
            Write-Host "[PASS] manifest '$id' matches $(Split-Path -Leaf $file) ($fileSize bytes, sha256 $fileHash)"
          }
          echo "models_zip=$modelsZip" >> $env:GITHUB_OUTPUT
          echo "models_sidecar=$modelsSidecar" >> $env:GITHUB_OUTPUT
          echo "manifest=$manifest" >> $env:GITHUB_OUTPUT

      - name: Refuse release upload when an installer already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.version }}"
          $release = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect release $tag; refusing upload" }
          $assets = $release | ConvertFrom-Json
          $installer = @($assets.assets | Where-Object { $_.name -like 'SamsaraSetup-*.exe' })
          if ($installer.Count -gt 0) {
            throw "Refusing to upload to $tag: it already has installer asset(s): $($installer.name -join ', ')"
          }

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Asset attachment must never publish the build workflow's draft.
          draft: true
          make_latest: false
          tag_name: ${{ inputs.version }}
          overwrite_files: false
          files: |
            ${{ steps.gate.outputs.zip }}
            ${{ steps.gate.outputs.sidecar }}
            ${{ steps.gate.outputs.models_zip }}
            ${{ steps.gate.outputs.models_sidecar }}
            ${{ steps.gate.outputs.manifest }}
          generate_release_notes: true

      # ----------------------------------------------------------------------
      # CUDA pack -- NOT built on CI this pass.
      #
      # v0.20.0's Samsara-CUDA-Pack.zip (~1.05GB) was built locally by copying
      # cuDNN/cuBLAS/cuDART DLLs out of the LOCAL torch install at
      # <python-env>\Lib\site-packages\torch\lib (see scripts\samsara.spec's INCLUDE_CUDA=1
      # branch, which reads those DLLs from site-packages\torch\lib). A
      # GitHub-hosted windows-latest runner has no GPU and no reason to carry
      # a CUDA-enabled torch install, so that source directory does not exist
      # on CI -- INCLUDE_CUDA=1 would either no-op (spec's `if os.path.exists`
      # guards) or require pulling a multi-GB CUDA torch wheel just to
      # harvest DLLs from it, then discarding torch itself. Two paths to
      # eventually running this on CI, for whenever the CUDA pack needs to be
      # CI-traceable too:
      #
      #   1. `pip install torch --index-url https://download.pytorch.org/whl/cu121`
      #      in a separate build-cuda job, set INCLUDE_CUDA=1, run PyInstaller
      #      again, harvest the DLLs from that runner's torch install. Costs:
      #      a multi-GB torch download + a second full PyInstaller pass, just
      #      to get at ~150MB of DLLs.
      #   2. Add a separate clean-checkout local/CI CUDA release pipeline with
      #      its own smoke and artifact checks. The existing build_cuda.bat is
      #      a developer helper, not a releasable-artifact producer.
      #
      # Until one path exists, releases advertise and attach the CPU zip only.
      # ----------------------------------------------------------------------
